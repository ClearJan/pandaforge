[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotstudio"
version = "1.6.2"
description = "PandaForge (package: robotstudio) - Interactive Robot Motion Planning & Manipulation Studio (Franka Panda + MuJoCo)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RobotStudio Contributors" }]
keywords = ["robotics", "motion-planning", "mujoco", "rrt", "inverse-kinematics", "grasping"]
classifiers = [
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "mujoco>=3.2.0",
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "PySide6-Essentials>=6.6",
    "pyqtgraph>=0.13.3",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.2", "ruff>=0.4", "pyinstaller>=6.5"]

[project.scripts]
robotstudio = "robotstudio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = [
    "E501",
    # zip() inputs are equal-length by construction throughout the codebase
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Math notation uses uppercase symbols (R, T1, E, ...) by convention.
"src/robotstudio/kinematics/*" = ["N802", "N803", "N806"]
"src/robotstudio/planning/rrt.py" = ["N806"]
"src/robotstudio/collision/checker.py" = ["N806"]
"src/robotstudio/manipulation/fsm.py" = ["N806"]
"src/robotstudio/planning/rrt_star.py" = ["N806"]
"src/robotstudio/manipulation/grasp.py" = ["N806"]
"src/robotstudio/simulation/engine.py" = ["N806"]
"tests/*" = ["N802", "N803", "N806"]
# Qt overrides use Qt's camelCase names.
"src/robotstudio/ui/*" = ["N802"]
